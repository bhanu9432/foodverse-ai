# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: foodverse-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: paste in the Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false          # free option: key from openrouter.ai
      - key: GEMINI_API_KEY
        sync: false          # free option: key from aistudio.google.com
      - key: FOODVERSE_MODEL
        value: claude-sonnet-5-5
